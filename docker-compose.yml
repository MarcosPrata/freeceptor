version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: freeceptor-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freeceptor-app
    ports:
      - "${PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/freeceptor
      - MONGODB_DB=${MONGODB_DB:-freeceptor}
      - PORT=3002
      - WS_PATH=${WS_PATH:-/ws}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
