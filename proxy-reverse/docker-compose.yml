services:
  proxy-reverse:
    build: .
    ports:
      - "${LOCAL_PORT:-8080}:8080"
    environment:
      - LOCAL_PORT=8080
      - FREECEPTOR_URL=${FREECEPTOR_URL}
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_PASSWORD=${SERVER_PASSWORD:-}
      - TARGET_URL=${TARGET_URL}
      - VERBOSE=${VERBOSE:-false}
    restart: unless-stopped
